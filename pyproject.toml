[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "e2e-hw-machine"
version = "0.1.0"
description = "e2e-HW-machine — 基于 Cursor Agent 的端到端作业自动化编排系统"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "rich>=13.0",
    "browser-cookie3",
]

[project.scripts]
machine = "secretary.cli:main"
kai = "secretary.cli:main"
# 兼容旧名
secretary = "secretary.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["secretary*"]

[tool.setuptools.package-data]
secretary = ["prompts/*.md"]
